<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Send Message</title>
<meta name="description" content="Tap to connect on WhatsApp.">
<meta name="theme-color" content="#f3f8f8">
<link rel="preconnect" href="https://wa.me">
<link rel="dns-prefetch" href="https://api.whatsapp.com">
<style>
*{box-sizing:border-box}html{font-family:Arial,Helvetica,sans-serif;color:#202923;background:#f4f7fc}body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#dff7ed 0,transparent 48%),radial-gradient(ellipse at 50% 100%,#e3f0eb 0,transparent 45%),#f5f7ff;display:flex;flex-direction:column}
main{flex:1;display:grid;place-items:center;padding:36px 20px 68px;min-height:calc(100svh - 48px)}
.card{width:100%;max-width:360px;padding:44px 30px 34px;border:1px solid #e7ecec;border-radius:32px;background:#ffffffb8;box-shadow:0 20px 38px #253e3820;text-align:center}
.emblem{position:relative;width:96px;height:96px;margin:0 auto 26px;border:6px solid #e9faf0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#22dc6b,#11b952);color:white;box-shadow:0 10px 22px #18c76025}
.emblem>svg{width:40px;height:40px}.badge{position:absolute;right:-5px;bottom:-7px;width:29px;height:29px;border-radius:50%;background:white;color:#15b65a;display:grid;place-items:center;box-shadow:0 3px 6px #183e3820}.badge svg{width:20px;height:20px}
h1{font-size:clamp(22px,6.2vw,26px);line-height:1.25;letter-spacing:1px;margin:0 0 12px;font-weight:700;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.status{font-size:14px;color:#5e6d65;margin:0 0 30px}.status:before{content:"";display:inline-block;width:7px;height:7px;background:#18bc60;border-radius:50%;margin-right:7px;vertical-align:1px}
.prompt{font-size:14px;line-height:1.5;color:#6a7871;margin:0 0 18px}
.contact{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:14px 12px;border-radius:16px;background:linear-gradient(#1dcc60,#18a957);box-shadow:0 14px 24px #18c65e30;color:#071b10;text-decoration:none;font-size:18px;font-weight:700;letter-spacing:.4px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.contact svg{width:25px;height:25px;flex-shrink:0}.contact:active{transform:scale(.98)}.contact:focus-visible,button:focus-visible{outline:3px solid #087934;outline-offset:4px}.contact[aria-disabled="true"]{opacity:.55;cursor:wait}
#error{font-size:14px;color:#9d2424;line-height:1.4;margin:20px 0 8px}#retry{font:inherit;border:1px solid #18a957;border-radius:10px;padding:10px 18px;background:white;color:#087934;min-height:44px}footer{text-align:center;color:#96a69e;font-size:13px;padding:0 16px max(20px,env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;align-items:center}footer svg{width:12px;height:12px}[hidden]{display:none!important}
@media(max-width:380px){main{padding:24px 16px 48px}.card{padding:36px 22px 30px;border-radius:28px}}@media(max-height:500px){main{padding:18px}.card{padding:22px}.emblem{margin-bottom:14px}.status{margin-bottom:18px}}
</style>
</head>
<body>
<main><section class="card" aria-label="WhatsApp contact">
<div class="emblem"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M34 19a14 14 0 0 1-21 12L5 34l2.5-8A14 14 0 1 1 34 19Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><circle cx="14" cy="19" r="1.8" fill="currentColor"/><circle cx="20" cy="19" r="1.8" fill="currentColor"/><circle cx="26" cy="19" r="1.8" fill="currentColor"/></svg><span class="badge"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 15.5a10 10 0 0 1-14.8 8.8L6 26l1.6-5.1A10 10 0 1 1 26 15.5Z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 10.5c.6-.3 1.4 1.7 1.5 2.1.1.4-.7.9-.8 1.3-.2.6 2.2 3.1 2.9 3.2.5.1 1-1 1.4-1 .5 0 2.4 1.1 2.4 1.5 0 1.5-1.5 2.3-2.7 2-3.8-.8-7.5-5-6.7-7.8.2-.7 1.2-1.2 2-1.3Z" fill="currentColor"/></svg></span></div>
<h1 id="number">+1 724-892-1474</h1>
<p class="status">Online</p>
<p class="prompt">Tap the button below to message on WhatsApp</p>
<a id="contact" class="contact" role="link" aria-disabled="true" tabindex="-1"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 15.5a10 10 0 0 1-14.8 8.8L6 26l1.6-5.1A10 10 0 1 1 26 15.5Z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 10.5c.6-.3 1.4 1.7 1.5 2.1.1.4-.7.9-.8 1.3-.2.6 2.2 3.1 2.9 3.2.5.1 1-1 1.4-1 .5 0 2.4 1.1 2.4 1.5 0 1.5-1.5 2.3-2.7 2-3.8-.8-7.5-5-6.7-7.8.2-.7 1.2-1.2 2-1.3Z" fill="currentColor"/></svg><span>Send Message</span></a>
<p id="error" role="status" hidden>Unable to load the WhatsApp contact. Please try again.</p><button id="retry" type="button" hidden>Try again</button>
<noscript><p>Please enable JavaScript to load the current WhatsApp contact.</p></noscript>
</section></main>
<footer><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="7" width="8" height="7" rx="1" fill="none" stroke="currentColor"/><path d="M5.5 7V4.5a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor"/></svg>Will open in WhatsApp</footer>
<script>(function () {
'use strict';
const button = document.getElementById('contact');
const number = document.getElementById('number');
const error = document.getElementById('error');
const retry = document.getElementById('retry');
const key = 'internalplans-whatsapp-v1';
let selected = null, readyAt = 0, pending = null, readyHref = null;
function remembered() {
  try { const saved = localStorage.getItem(key); if (saved) return saved; } catch (_) {}
  try { const c = document.cookie.split('; ').find(v => v.startsWith(key + '=')); if(c) return decodeURIComponent(c.slice(key.length + 1)); } catch (_) {}
  return selected;
}
function remember(phone) {
  selected = phone;
  try { localStorage.setItem(key, phone); } catch (_) {}
  try { document.cookie = key + '=' + encodeURIComponent(phone) + ';path=/;max-age=31536000;SameSite=Lax' + (location.protocol === 'https:' ? ';Secure' : ''); } catch (_) {}
}
function choose(config, previous, random = Math.random) {
  if (!config || !Array.isArray(config.accounts)) throw new Error('Invalid configuration');
  const active = config.accounts.filter(a => a && a.enabled !== false);
  if(active.some(a => typeof a.phone !== 'string' || !/^[1-9]\d{6,14}$/.test(a.phone))) throw new Error('Invalid phone');
  const phones = [...new Set(active.map(a => a.phone))];
  if(!phones.length) throw new Error('No available contacts');
  return phones.includes(previous) ? previous : phones[Math.floor(random() * phones.length)];
}
function format(phone) {
  return /^1\d{10}$/.test(phone) ? '+1 ' + phone.slice(1,4) + '-' + phone.slice(4,7) + '-' + phone.slice(7) : '+' + phone;
}
function fresh() { return readyHref && Date.now() - readyAt < 10000; }
function prepare(force = false) {
  if (pending) return pending;
  if (!force && fresh()) return Promise.resolve(readyHref);
  pending = (async () => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    try {
      const response = await fetch('accounts.json', {cache:'no-store', signal:controller.signal});
      if(!response.ok) throw new Error('Unavailable');
      const phone = choose(await response.json(), remembered());
      remember(phone);
      readyHref = 'https://wa.me/' + phone + '?text=pls';
      readyAt = Date.now();
      number.textContent = format(phone);
      button.href = readyHref;
      button.removeAttribute('aria-disabled');
      button.tabIndex = 0;
      error.hidden = retry.hidden = true;
      return readyHref;
    } catch (_) {
      readyHref = null; readyAt = 0;
      button.removeAttribute('href');
      button.setAttribute('aria-disabled', 'true');
      button.tabIndex = -1;
      error.hidden = retry.hidden = false;
      return null;
    } finally { clearTimeout(timer); }
  })().finally(() => { pending = null; });
  return pending;
}
button.addEventListener('click', async event => {
  if(fresh() && !pending) return;
  event.preventDefault();
  const href = await prepare();
  if(href) location.assign(href);
});
['pointerenter', 'pointerdown', 'focus'].forEach(name => button.addEventListener(name, () => prepare()));
retry.addEventListener('click', () => prepare(true));
window.addEventListener('pageshow', event => { if(event.persisted) { readyAt = 0; prepare(true); } });
document.addEventListener('visibilitychange', () => { if(!document.hidden) prepare(); });
setInterval(() => { if(!document.hidden) prepare(); }, 10000);
prepare();
})();</script>
</body></html>
